# ═══════════════════════════════════════
# The Lore Weaver's Cauldron — Docker Compose
# ═══════════════════════════════════════
# Starta: docker compose up -d
# Loggar: docker compose logs -f
# Stoppa: docker compose down

services:
  morkrets-rike:
    build: .
    container_name: morkrets-rike
    restart: unless-stopped
    ports:
      # 2026-08-04: bindning hålls på 0.0.0.0 — nginx (NPM) proxar till
      # 192.168.0.53:8092 och 127.0.0.1-bindning gav 502. Exposure-hantering:
      # (a) Cloudflare frontar domänen, (b) REKOMMENDERAD: ta bort port-
      # forwarden för 8092 i routern så origin-porten inte nås utifrån.
      - "8092:8090"
    volumes:
      # Kampanjdata + användare persistas
      - ./backend/data:/app/backend/data
    env_file:
      - ./backend/.env
      - ./backend/.env.stripe
    environment:
      - HOST=0.0.0.0
      - PORT=8090
      # HTTPS-only (Cloudflare/nginx) → Secure-cookie flaggan på
      - COOKIE_SECURE=1
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - ai-services   # delat nätverk → når Qdrant via containernamnet
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8090/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ai-services:
    external: true
