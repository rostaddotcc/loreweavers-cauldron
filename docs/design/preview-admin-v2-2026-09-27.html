<title>Admin v2 · Mission Control — design sketch</title>
<!--
  DESIGN SKETCH for the admin dashboard refresh (2026-09-27).
  Real production aggregates (accounts/campaigns/revenue ledger/model usage/visits),
  per-player rows pseudonymised. Mock data is inline so this file can be opened anywhere.
  Modern console language on purpose: admin-only surface, NOT aligned with the game's
  grimoire/pixel canon (see docs/plans/admin-dashboard-v2-2026-09-27.md).
  Radius/pixel notes: this page does not load snes.css, so radii are allowed here.

<style>
  :root{
    --bg:#0a0e13; --panel:#121924; --panel-2:#161f2c; --panel-3:#1b2534;
    --line:#25313f; --line-2:#2f3d4e;
    --txt:#e8eef7; --dim:#9aabc1; --dim-2:#7d8ea4;
    --accent:#5b8cff; --accent-dim:#2a3c66; --accent-ink:#0a0e13;
    --good:#3fbf8f; --bad:#e0605e; --warn:#e0a24a; --violet:#a97bff; --teal:#4fc3c8; --gold:#e2b53f;
    --radius:10px; --radius-sm:6px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    --shadow:0 18px 40px rgba(0,0,0,.45);
  }
  html[data-theme="light"]{
    --bg:#f4f6fa; --panel:#ffffff; --panel-2:#f7f9fc; --panel-3:#eef2f8;
    --line:#e1e7f0; --line-2:#cdd7e5;
    --txt:#0f1a28; --dim:#5a6b83; --dim-2:#61718a;
    --accent:#2f5fe0; --accent-dim:#dfe7ff; --accent-ink:#ffffff;
    --good:#0f7d57; --bad:#c93636; --warn:#8f5c10; --violet:#6b46c1; --teal:#0b6f76; --gold:#b8860b;
    --shadow:0 14px 30px rgba(16,32,64,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt); font-family:var(--sans);
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-width:1020px; min-height:660px; align-items:stretch}

  /* ── sidebar ───────────────────────────────────────────── */
  #nav{
    width:208px; flex:0 0 208px; background:var(--panel); border-right:1px solid var(--line);
    padding:16px 12px; display:flex; flex-direction:column; gap:4px;
  }
  .brand{display:flex; align-items:center; gap:9px; padding:4px 8px 16px}
  .brand .mark{
    width:26px; height:26px; border-radius:7px; background:linear-gradient(140deg,var(--accent),var(--violet));
    display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff;
  }
  .brand b{font-size:13px; letter-spacing:.02em}
  .brand span{display:block; font-size:10.5px; color:var(--dim-2); letter-spacing:.09em; text-transform:uppercase}
  .nav-item{
    display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:var(--radius-sm);
    color:var(--dim); cursor:pointer; font-size:13px; border:1px solid transparent; background:none;
    font-family:inherit; text-align:left; width:100%; min-height:38px;
  }
  .nav-item:hover{background:var(--panel-2); color:var(--txt)}
  .nav-item.cur{background:var(--accent-dim); color:var(--txt); border-color:var(--line-2); font-weight:600}
  .nav-item .ico{width:17px; text-align:center; font-size:13px}
  .nav-item .badge{margin-left:auto; font-size:10.5px; color:var(--dim-2)}
  .nav-sep{margin:10px 10px 4px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim-2)}
  .nav-foot{margin-top:auto; padding:10px 10px 2px; font-size:10.5px; color:var(--dim-2); line-height:1.5}

  /* ── main ──────────────────────────────────────────────── */
  #main{flex:1; min-width:0; display:flex; flex-direction:column}
  #topbar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .crumbs{font-size:12.5px; color:var(--dim); display:flex; align-items:center; gap:6px; min-width:180px}
  .crumbs b{color:var(--txt); font-weight:600; font-size:14px}
  .crumbs .sep{color:var(--dim-2)}
  .scope{display:flex; align-items:center; gap:6px; margin-left:auto; flex-wrap:wrap}
  .scope .lbl{font-size:11px; color:var(--dim-2); text-transform:uppercase; letter-spacing:.07em}
  .chip{
    border:1px solid var(--line-2); background:var(--panel-2); color:var(--dim); border-radius:999px;
    padding:5px 11px; font-size:12px; cursor:pointer; font-family:inherit; min-height:30px;
  }
  .chip:hover{color:var(--txt); border-color:var(--accent)}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
  .icon-btn{
    border:1px solid var(--line-2); background:var(--panel-2); color:var(--dim); border-radius:var(--radius-sm);
    min-height:32px; padding:0 10px; cursor:pointer; font-family:inherit; font-size:12.5px;
  }
  .icon-btn:hover{color:var(--txt); border-color:var(--accent)}
  .stamp{font-size:11px; color:var(--dim-2); font-variant-numeric:tabular-nums}

  #view{padding:18px 20px 40px; overflow:auto}
  .view-head{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .view-head h1{margin:0; font-size:19px; letter-spacing:-.01em}
  .view-head p{margin:0; color:var(--dim); font-size:12.5px; max-width:70ch}
  .view-head .spacer{flex:1}

  /* ── cards & grid ──────────────────────────────────────── */
  .grid{display:grid; gap:12px; grid-template-columns:repeat(12,minmax(0,1fr))}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; min-width:0;
  }
  .card h3{margin:0 0 2px; font-size:13px; letter-spacing:.01em}
  .card .sub{color:var(--dim-2); font-size:11.5px; margin-bottom:10px}
  .span3{grid-column:span 3} .span4{grid-column:span 4} .span5{grid-column:span 5}
  .span6{grid-column:span 6} .span7{grid-column:span 7} .span8{grid-column:span 8}
  .span12{grid-column:span 12}
  .card.clickable{cursor:pointer; transition:border-color .14s, transform .14s}
  .card.clickable:hover{border-color:var(--accent); transform:translateY(-1px)}

  .kpi{display:flex; flex-direction:column; gap:3px; min-height:104px}
  .kpi .t{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim-2)}
  .kpi .v{font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .kpi .v.good{color:var(--good)} .kpi .v.accent{color:var(--accent)} .kpi .v.warn{color:var(--warn)}
  .kpi .f{font-size:11.5px; color:var(--dim); margin-top:auto}
  .kpi .f b{color:var(--txt); font-weight:600}
  .kpi .cta{font-size:11px; color:var(--accent); opacity:0; transition:opacity .14s}
  .card.clickable:hover .cta{opacity:1}

  /* ── charts ────────────────────────────────────────────── */
  .vchart{display:flex; align-items:flex-end; gap:3px; height:132px; margin-top:6px}
  .vcol{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; cursor:pointer; min-width:0}
  .vcol .track{width:100%; flex:1; display:flex; align-items:flex-end}
  .vcol .fill{width:100%; background:linear-gradient(180deg,var(--accent),#2b4f9e); border-radius:3px 3px 0 0; min-height:2px}
  .vcol.rev .fill{background:linear-gradient(180deg,var(--gold,#e2b53f),#8a6a12)}
  .vcol:hover .fill{filter:brightness(1.25)}
  .vcol .lab{font-size:9.5px; color:var(--dim-2); white-space:nowrap}
  .vcol.today .lab{color:var(--accent); font-weight:700}
  .legend{display:flex; flex-direction:column; gap:7px; margin-top:4px}
  .legend button{
    display:flex; align-items:center; gap:8px; background:none; border:0; color:inherit;
    font-family:inherit; font-size:12.5px; cursor:pointer; padding:3px 6px; border-radius:var(--radius-sm); text-align:left;
  }
  .legend button:hover{background:var(--panel-2)}
  .dot{width:9px; height:9px; border-radius:50%; flex:0 0 9px}
  .legend .val{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--dim)}
  .legend .pct{margin-left:8px; font-variant-numeric:tabular-nums; color:var(--dim-2); font-size:11.5px; min-width:38px; text-align:right}
  .hbars{display:flex; flex-direction:column; gap:8px; margin-top:4px}
  .hbar{cursor:pointer}
  .hbar .row{display:flex; font-size:12px; margin-bottom:3px}
  .hbar .row .nm{color:var(--txt); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hbar .row .vl{margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; padding-left:10px}
  .hbar .track{height:7px; background:var(--panel-3); border-radius:4px; overflow:hidden}
  .hbar .fill{height:100%; background:var(--accent); border-radius:4px}
  .hbar:hover .fill{filter:brightness(1.2)}
  .empty{
    display:flex; flex-direction:column; align-items:center; gap:6px; justify-content:center;
    color:var(--dim-2); font-size:12px; padding:26px 10px; text-align:center;
  }
  .empty .g{font-size:20px; opacity:.6}

  /* ── tables ────────────────────────────────────────────── */
  .tbl-wrap{overflow:auto; border:1px solid var(--line); border-radius:var(--radius-sm); max-width:100%}
  table{border-collapse:collapse; width:100%; font-size:12.5px}
  th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap}
  th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim-2); font-weight:600; background:var(--panel-2); position:sticky; top:0}
  td{font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--panel-2)}
  tbody tr:last-child td{border-bottom:0}
  .num{text-align:right}
  .tag{
    display:inline-block; font-size:10.5px; padding:2px 7px; border-radius:999px;
    border:1px solid var(--line-2); color:var(--dim); background:var(--panel-2);
  }
  .tag.free{color:var(--dim)} .tag.tier1{color:var(--teal); border-color:var(--teal)}
  .tag.tier2{color:var(--violet); border-color:var(--violet)} .tag.lifetime{color:var(--warn); border-color:var(--warn)}
  .tag.paid{color:var(--good); border-color:var(--good)}

  /* ── drawer ────────────────────────────────────────────── */
  #scrim{position:fixed; inset:0; background:rgba(4,8,14,.55); opacity:0; pointer-events:none; transition:opacity .16s; z-index:40}
  #scrim.on{opacity:1; pointer-events:auto}
  #drawer{
    position:fixed; top:0; right:0; height:100%; width:520px; max-width:92vw; z-index:41;
    background:var(--panel); border-left:1px solid var(--line-2); box-shadow:var(--shadow);
    transform:translateX(102%); transition:transform .18s ease; display:flex; flex-direction:column;
  }
  #drawer.on{transform:none}
  #drawer header{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line)}
  #drawer header .kind{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--dim-2)}
  #drawer header h2{margin:0; font-size:15px}
  #drawer header .x{margin-left:auto; background:none; border:1px solid var(--line-2); color:var(--dim); border-radius:var(--radius-sm); min-height:30px; padding:0 10px; cursor:pointer; font-family:inherit}
  #drawer .dbody{padding:14px 16px 30px; overflow:auto}
  .tabs{display:flex; gap:6px; margin:2px 0 12px; flex-wrap:wrap}
  .tabs button{border:1px solid var(--line-2); background:var(--panel-2); color:var(--dim); border-radius:999px; padding:5px 11px; font-size:12px; cursor:pointer; font-family:inherit}
  .tabs button.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
  .dgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-bottom:14px}
  .dstat{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:9px 11px}
  .dstat .t{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim-2)}
  .dstat .v{font-size:16px; font-variant-numeric:tabular-nums; font-weight:600}
  .note{font-size:11.5px; color:var(--dim-2); border-left:2px solid var(--line-2); padding-left:9px; margin:12px 0}
  .acts{display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 4px}
  .acts button{border:1px solid var(--line-2); background:var(--panel-2); color:var(--txt); border-radius:var(--radius-sm); min-height:34px; padding:0 11px; font-family:inherit; font-size:12px; cursor:pointer}
  .acts button:hover{border-color:var(--accent)}
  .acts button.danger{color:var(--bad); border-color:var(--bad)}
  .spark{display:flex; align-items:flex-end; gap:2px; height:44px; margin:8px 0 2px}
  .spark i{flex:1; background:var(--accent); opacity:.75; border-radius:2px 2px 0 0; min-height:1px}

  /* ── misc ──────────────────────────────────────────────── */
  .tiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
  #toasts{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:60}
  .toast{background:var(--panel-3); border:1px solid var(--line-2); color:var(--txt); padding:9px 14px; border-radius:999px; font-size:12.5px; box-shadow:var(--shadow)}
  .mock-note{
    margin:0 0 14px; padding:9px 12px; border:1px dashed var(--line-2); border-radius:var(--radius-sm);
    font-size:11.5px; color:var(--dim); background:var(--panel-2);
  }
  .mock-note b{color:var(--txt)}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

/* ─────────────────────────── helpers ─────────────────────────── */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const fmtNum = n => (n == null ? '—' : Number(n).toLocaleString('en-US'));
const fmtSek = n => fmtNum(Math.round(n || 0)) + ' kr';
const fmtTok = n => { n = n || 0; if (n >= 1e9) return (n/1e9).toFixed(2)+'B'; if (n >= 1e6) return (n/1e6).toFixed(1)+'M'; if (n >= 1e3) return (n/1e3).toFixed(1)+'k'; return String(n); };
const sum = o => Object.values(o).reduce((a, b) => a + (b || 0), 0);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = m => m === '__unlabelled' ? 'unlabelled / legacy' : m.replace(/^orfree:/, '').replace(/:free$/, '');
const modelName = m => m === '__unlabelled' ? 'Unlabelled / legacy rows' : m.replace(/^orfree:/, '');
const provColor = p => ({stepfun:'#e0a24a', dashscope:'#5b8cff', deepseek:'#3fbf8f', openrouter:'#a97bff', unlabelled:'#6b7c92'})[p] || '#6b7c92';
const PALETTE = ['#5b8cff', '#e0a24a', '#3fbf8f', '#a97bff', '#4fc3c8', '#e0605e', '#8d9db3'];

let WIN = '30d';
let state = {view:'overview', entity:null, metric:'calls', revMode:'day'};

function windowDays(){
  if (WIN === '24h') return 1;
  if (WIN === '7d') return 7;
  if (WIN === '30d') return 30;
  return 3650;
}
function inWindow(day){
  const d = new Date(day + 'T00:00:00');
  const cut = new Date('2026-09-27T00:00:00');
  cut.setDate(cut.getDate() - windowDays() + 1);
  return d >= cut;
}
function pick(series){ const out = {}; Object.keys(series).forEach(k => { if (inWindow(k)) out[k] = series[k]; }); return out; }

/* ─────────────────────────── charts ─────────────────────────── */
function vchart(series, opts){
  opts = opts || {};
  const keys = Object.keys(series);
  if (!keys.length) return emptyState('No data in this window');
  const max = Math.max.apply(null, keys.map(k => series[k])) || 1;
  const last = keys[keys.length - 1];
  const cols = keys.map(k => {
    const v = series[k];
    const h = Math.max(Math.round(v / max * 100), v ? 2 : 0);
    const lab = opts.labelEvery ? (opts.labelEvery(k, keys.indexOf(k), keys.length)) : k.slice(5);
    return '<div class="vcol' + (k === last ? ' today' : '') + (opts.rev ? ' rev' : '') + '" data-day="' + k + '" data-val="' + v + '">' +
      '<span class="lab">' + (v && (keys.length <= 16 || opts.alwaysLabel) ? fmtNum(v) : '') + '</span>' +
      '<span class="track"><span class="fill" style="height:' + h + '%"></span></span>' +
      '<span class="lab">' + lab + '</span></div>';
  }).join('');
  return '<div class="vchart">' + cols + '</div>';
}
function donut(items, centerLabel){
  const total = items.reduce((a, b) => a + b.value, 0);
  if (!total) return emptyState('Nothing to split yet');
  const C = 2 * Math.PI * 70;
  let off = 0;
  const arcs = items.map((it, i) => {
    const frac = it.value / total;
    const dash = Math.max(frac * C - 1.6, 0.001);
    const el = '<circle r="70" cx="100" cy="100" fill="none" stroke="' + (it.color || PALETTE[i % PALETTE.length]) + '" stroke-width="26" ' +
      'stroke-dasharray="' + dash + ' ' + (C - dash) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 100 100)">' +
      '<title>' + esc(it.label) + ': ' + fmtNum(it.value) + '</title></circle>';
    off += frac * C;
    return el;
  }).join('');
  return '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' +
    '<svg viewBox="0 0 200 200" style="width:150px;height:150px;flex:0 0 150px">' +
    '<circle r="70" cx="100" cy="100" fill="none" stroke="var(--line)" stroke-width="26"></circle>' + arcs +
    '<text x="100" y="96" text-anchor="middle" fill="currentColor" font-size="17" font-weight="600">' + esc(centerLabel || fmtNum(total)) + '</text>' +
    '<text x="100" y="114" text-anchor="middle" fill="currentColor" font-size="10" opacity=".55">' + esc(items.length + ' parts') + '</text></svg>' +
    '<div class="legend" style="flex:1;min-width:180px">' + items.map((it, i) =>
      '<button data-leg="' + i + '"><span class="dot" style="background:' + (it.color || PALETTE[i % PALETTE.length]) + '"></span>' +
      esc(it.label) + '<span class="val">' + fmtNum(it.value) + '</span>' +
      '<span class="pct">' + (total ? (it.value / total * 100).toFixed(1) : '0') + '%</span></button>').join('') +
    '</div></div>';
}
function hbars(items, opts){
  opts = opts || {};
  if (!items.length) return emptyState('Nothing here in this window');
  const max = Math.max.apply(null, items.map(i => i.value)) || 1;
  return '<div class="hbars">' + items.map(i =>
    '<div class="hbar" data-key="' + esc(i.key || i.label) + '"><div class="row"><span class="nm">' + esc(i.label) + '</span>' +
    '<span class="vl" style="color:' + (i.color || 'var(--dim)') + '">' + (opts.fmt ? opts.fmt(i.value) : fmtNum(i.value)) + '</span></div>' +
    '<span class="track"><span class="fill" style="width:' + Math.max(i.value / max * 100, i.value ? 2 : 0) + '%;background:' + (i.color || 'var(--accent)') + '"></span></span></div>').join('') + '</div>';
}
function spark(series){
  const keys = Object.keys(series);
  if (!keys.length) return '';
  const max = Math.max.apply(null, keys.map(k => series[k])) || 1;
  return '<div class="spark">' + keys.map(k =>
    '<i style="height:' + Math.max(series[k] / max * 100, series[k] ? 4 : 1) + '%" title="' + k + ': ' + fmtNum(series[k]) + '"></i>').join('') + '</div>';
}
function emptyState(msg){ return '<div class="empty"><span class="g">✧</span>' + esc(msg) + '</div>'; }

/* ─────────────────────────── KPI card ─────────────────────────── */
function kpi(o){
  return '<div class="card kpi clickable" data-drill="' + esc(o.drill) + '">' +
    '<span class="t">' + esc(o.t) + '</span>' +
    '<span class="v ' + (o.tone || '') + '">' + esc(o.v) + '</span>' +
    '<span class="f">' + o.f + '</span>' +
    '<span class="cta">drill down →</span></div>';
}

/* ─────────────────────────── views ─────────────────────────── */
function revenueTotals(){
  const rows = D.ledger;
  const lifetime = rows.reduce((a, r) => a + r.sek, 0);
  const month = rows.filter(r => (r.ts || '').slice(0, 7) === '2026-09').reduce((a, r) => a + r.sek, 0);
  const today = rows.filter(r => r.ts === '2026-09-27').reduce((a, r) => a + r.sek, 0);
  const payers = new Set(rows.filter(r => r.sek > 0).map(r => r.user));
  return {lifetime, month, today, payers:payers.size, txs:rows.filter(r => r.sek > 0).length};
}

/* ── value delivered: the other half of the money story ── */
function valueStats(){
  const days = pick(D.turnsDay);
  const turnsAll = D.turnsTotal;
  /* the logged turn series covers 30 days; the 'all' window must use the true total */
  const turnsWindow = WIN === 'all' ? turnsAll : sum(days);
  const callsWindow = sum(pick(D.callsDay));
  const sek = revenueTotals().lifetime;
  const tokens = D.totals.tokens;
  return {
    turnsWindow, turnsAll, callsWindow, tokens, sek, turnsDay: days,
    tokPerSek: sek ? Math.round(tokens / sek) : null,
    krPerM: tokens ? (1e6 * sek / tokens) : null
  };
}
function payerCountry(user){
  const p = D.players.find(x => x.u === user);
  if (p) return {cc: p.cc.slice(0, 2).trim(), name: p.country};
  return {cc: '??', name: 'Unknown'};
}
function isoWeekKey(dstr){
  const d = new Date(dstr + 'T00:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));  // Monday start
  // local components on purpose: toISOString() would shift the key back a day in CEST
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function revBuckets(mode){
  const out = {};
  D.ledger.forEach(r => {
    if (!r.sek) return;
    const k = mode === 'day' ? r.ts : mode === 'week' ? isoWeekKey(r.ts) : r.ts.slice(0, 7);
    out[k] = (out[k] || 0) + r.sek;
  });
  return out;
}

/* ─────────────────────────── CSV ─────────────────────────── */
function toCsv(rows){
  return rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/csv'}));
  a.download = name; a.click();
  toast('Exported ' + name);
}
function exportCsv(what){
  if (what === 'players') return download('players.csv', toCsv([['user','role','tier','country','campaigns','tokens','calls','revenue','last_active']].concat(D.players.map(p => [p.u, p.role, p.tier, p.country, p.camps, p.tokens, p.calls, p.rev, p.last]))));
  if (what === 'ledger') return download('ledger.csv', toCsv([['date','user','sek','type','note']].concat(D.ledger.map(r => [r.ts, r.user, r.sek, r.type, r.note]))));
  if (what === 'visits') return download('visits.csv', toCsv([['day','visits']].concat(Object.entries(D.visitsDay))));
  return download('ai_calls.csv', toCsv([['day','calls']].concat(Object.entries(D.callsDay))));
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* ─────────────────────────── events ─────────────────────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-drill],[data-leg],[data-player],[data-ledger],[data-day],[data-key],[data-csv],[data-metric],[data-act],[data-rev],[data-country],[data-value],.chip[data-win]');
  if (!t) return;
  if (t.dataset.view){ state.view = t.dataset.view; state.entity = null; closeDrawer(); render(); return; }
  if (t.dataset.win){ WIN = t.dataset.win; render(); return; }
  if (t.dataset.metric){ state.metric = t.dataset.metric; render(); return; }
  if (t.dataset.rev){ state.revMode = t.dataset.rev; render(); return; }
  if (t.dataset.value){ return drawerValue(); }
  if (t.dataset.csv){ exportCsv(t.dataset.csv); return; }
  if (t.dataset.drill){
    const d = t.dataset.drill;
    if (d.startsWith('rev:')) return drawerRevenue(d.split(':')[1]);
    if (d.startsWith('usage:')) return openDrawer('usage', d.split(':')[1], '<div class="note">Breakdown of every model bucket behind this number, with per-day series and tokens per call.</div>' + hbars(Object.entries(D.models).map(([m, v]) => ({key:m, label:modelName(m), value:v[d.endsWith('tokens') ? 'tokens' : 'calls'], color:provColor(v.prov)})).sort((a, b) => b.value - a.value), {}));
    if (d.startsWith('traffic')) return openDrawer('traffic', 'Traffic', hbars(D.countries.map((c, i) => ({key:c[0], label:c[1], value:c[2], color:PALETTE[i % PALETTE.length]})), {fmt:fmtNum}));
    return; // 'players' → nothing extra, the table is right there
  }
  if (t.dataset.leg != null){
    const card = t.closest('.card');
    const key = t.dataset.leg;
    const donutItems = $$('.legend button', card);
    const idx = Number(key);
    const name = donutItems[idx] ? donutItems[idx].textContent.trim().split(/\s{2,}/)[0] : 'slice';
    const prod = D.products.find(p => p.label === name.trim());
    if (prod) return drawerProduct(prod.key);
    return openDrawer('breakdown', name, '<div class="note">Slice drill-down: the records behind this segment.</div>');
  }
  if (t.dataset.product) return drawerProduct(t.dataset.product);
  if (t.dataset.player) return drawerPlayer(t.dataset.player);
  if (t.dataset.ledger) return drawerLedger(t.dataset.ledger);
  if (t.dataset.day) return drawerDay(t.dataset.day, t.dataset.val, 'Calls logged');
  if (t.dataset.key){
    const m = t.dataset.key;
    if (D.models[m]) return drawerModel(m);
    if (/^[A-Z]{2}$/.test(m) && D.revenueByCountry.some(c => c[0] === m)) return drawerCountry(m);
    return openDrawer('breakdown', m, '<div class="note">Drill-down for this row (per-day series and the underlying records).</div>');
  }
  if (t.dataset.act) return toast('Action "' + t.dataset.act + '" is wired to the existing endpoint in the real build');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
$('#dclose').addEventListener('click', closeDrawer);
$('#scrim').addEventListener('click', closeDrawer);
$('#theme').addEventListener('click', () => {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
});
$('#refresh').addEventListener('click', () => { toast('Refetching /api/admin/overview…'); render(); });
$('#pq') && $('#pq').addEventListener('input', () => {});

render();
</script>
</body>
</html>
