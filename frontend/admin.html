<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control · Ayoub Industries</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0e13">
<link rel="icon" href="favicon.ico">
<!--
  Admin console v2 ("Mission Control") — replaces the old dark-fantasy CEO dashboard.
  This surface is deliberately NOT part of the game's visual canon: it loads its own design
  system (admin.css) and never snes.css/rail.css, so the game's flat-radius reset does not apply here.
  Rendering is admin.js; every mutation goes through admin-actions.js (byte-identical /api/admin/... calls).
  This file is the shell; at cutover it becomes frontend/admin.html.
-->
<link rel="stylesheet" href="admin.css?v=20260928d">
</head>
<body>
<div id="app">
  <aside id="nav">
    <div class="brand">
      <div class="mark">MC</div>
      <div><b>Mission Control</b><span>Ayoub Industries</span></div>
    </div>
    <div class="nav-sep">Analytics</div>
    <button class="nav-item" data-view="overview"><span class="ico">◈</span> Overview</button>
    <button class="nav-item" data-view="revenue"><span class="ico">◍</span> Revenue <span class="badge" id="nav-rev"></span></button>
    <button class="nav-item" data-view="players"><span class="ico">◉</span> Players <span class="badge" id="nav-players"></span></button>
    <button class="nav-item" data-view="usage"><span class="ico">⌁</span> Usage</button>
    <button class="nav-item" data-view="traffic"><span class="ico">⇢</span> Traffic</button>
    <div class="nav-sep">Operations</div>
    <button class="nav-item" data-view="feedback"><span class="ico">✎</span> Feedback <span class="badge" id="nav-fb"></span></button>
    <button class="nav-item" data-view="system"><span class="ico">⚙</span> System</button>
    <div class="nav-foot">
      <div>read-only console</div>
      <div class="stamp" id="nav-stamp"></div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="scope">
        <span class="lbl">Window</span>
        <div class="seg" id="win-seg">
          <button type="button" data-win="24h">24h</button>
          <button type="button" data-win="7d">7d</button>
          <button type="button" data-win="30d">30d</button>
          <button type="button" data-win="all">All</button>
        </div>
        <span class="stamp" id="stamp"></span>
        <button class="icon-btn" id="auto-btn" title="Reload the numbers every 60 seconds">⟲ Auto: off</button>
        <button class="icon-btn" id="theme-btn" title="Switch light / dark">◐ Theme</button>
        <button class="icon-btn" id="refresh-btn" title="Reload every number on this page">↻ Refresh</button>
        <a class="icon-btn" href="chat.html" title="Back to the game table">⚔ Table</a>
      </div>
    </header>
    <div id="view" aria-live="polite">
      <div class="loading">Loading Mission Control…</div>
    </div>
  </div>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <header>
    <div><div class="kind" id="dkind"></div><h2 id="dtitle"></h2></div>
    <button class="x" id="dclose" title="Close (Esc)">Esc ✕</button>
  </header>
  <div class="dbody" id="dbody"></div>
</aside>
<div id="toasts"></div>

<script src="admin-actions.js?v=20260927b"></script>
<script src="admin.js?v=20260928d"></script>
</body>
</html>
