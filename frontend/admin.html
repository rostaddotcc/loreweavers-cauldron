    html += `<div class="mc-meta"><span>${u.total_campaigns} campaigns</span><span>${u.total_turns} turns</span><span>${relTime(u.last_active)}</span></div>`;
    html += `<div class="mc-meta"><span>🔊 TTS: ${fmtTTS(u)}</span><span>${fmtTokens(u.tts_tokens || 0)} tkn</span><span>${u.tts_calls || 0} renders</span></div>`;
    html += `<div class="mc-meta"><span>🎭 Char: ${u.char_creation_tokens ? fmtTokens(u.char_creation_tokens) : '—'} tkn</span><span>🖼️ Img: ${u.image_gen_calls || 0}</span></div>`;
    html += `<div class="mc-meta"><span>Created ${relTime(u.created_at)}</span><span>Login ${relTime(u.last_login)}</span></div>`;
    html += `<div class="mc-meta"><span>💳 ${isPremium ? 'Premium' : 'Free'}</span><span>💰 Rev: ${u.revenue ? fmtSek(u.revenue) : '—'}</span><span>🎚️ Cap: ${capVal === 0 ? '∞' : capVal} (used ${u.period_turns_used || 0}${u.turn_bonus ? ' +' + u.turn_bonus + ' bought' : ''}${u.promo_bonus ? ' +' + u.promo_bonus + ' promo' : ''})</span></div>`;
    html += `<div class="mc-cap" style="display:flex;gap:.4rem;align-items:center;margin-top:.5rem;flex-wrap:wrap">`;
    html += `<input type="number" min="0" step="1" value="${capVal}" id="cap-${i}" class="cap-input">`;
    html += `<button onclick="event.stopPropagation();setCap('${u.username}', ${i})" class="cap-btn">Set cap</button>`;
    html += `<span class="cap-hint">0 = unlimited</span></div>`;
    html += `<div class="mc-billing" style="display:flex;gap:.4rem;align-items:center;margin-top:.4rem;flex-wrap:wrap">`;
    html += `<input type="number" min="1" step="1" value="10" id="topup-${u.username}" class="cap-input" style="width:60px">`;
    html += `<button onclick="event.stopPropagation();topUp('${u.username}')" class="bc-btn">➕ Top up</button>`;
    html += `<button onclick="event.stopPropagation();resetTurns('${u.username}')" class="bc-btn">🔄 Reset</button>`;
    if (!isPremium) {
      html += `<select id="pg-m-tier-${u.username}" onclick="event.stopPropagation()" onchange="syncTierDuration('${esc(u.username)}')" style="background:var(--ink);border:1px solid var(--edge);color:var(--bone);font-size:.78rem;padding:.2rem;border-radius:2px;max-width:80px"><option value="tier2">Patron 30€</option><option value="lifetime">♾ 100€</option></select>`;
      html += `<select id="pg-m-months-${u.username}" onclick="event.stopPropagation()" style="background:var(--ink);border:1px solid var(--edge);color:var(--bone);font-size:.78rem;padding:.2rem;border-radius:2px;max-width:52px"><option value="7" selected>7d</option><option value="30">1mo</option><option value="90">3mo</option><option value="180">6mo</option><option value="365">1y</option><option value="0">∞</option></select>`;
    }
    html += `<button onclick="event.stopPropagation();${isPremium ? "setTier('" + u.username + "', 'free')" : "grantPremiumFromRow('" + u.username + "')"}" class="bc-btn${isPremium ? '' : ' gold'}">${isPremium ? '⭱ Free' : '👑 Grant'}</button>`;
    html += '</div>';
    html += '</div>';
  });
  if (!users.length) html = '<div class="chart-empty" style="padding:.8rem">No players match the current filters</div>';
  return html;
}

// ═══════════════════════════════════════
// TOGGLE CAMPAIGN DETAIL
// ═══════════════════════════════════════
const loadedUsers = {};

async function toggleDetail(idx, username) {
  const detail = document.getElementById('detail-' + idx);
  const row = document.getElementById('row-' + idx);
  const inner = document.getElementById('inner-' + idx);

  if (detail.classList.contains('open')) {
    detail.classList.remove('open');
    row.classList.remove('expanded');
    return;
  }

  // Close all others
  document.querySelectorAll('.campaign-detail.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.player-row.expanded').forEach(r => r.classList.remove('expanded'));

  detail.classList.add('open');
  row.classList.add('expanded');
  inner.innerHTML = '<div class="loading">Loading campaigns</div>';

  if (loadedUsers[username]) {
    renderDetail(inner, loadedUsers[username]);
    return;
  }

  try {
    const res = await fetch('/api/admin/user/' + encodeURIComponent(username), { credentials: 'include' });
    if (!res.ok) throw new Error('Could not fetch user data');
    const data = await res.json();
    loadedUsers[username] = data;
    renderDetail(inner, data);
  } catch (e) {
    inner.innerHTML = '<div class="error-state"><p>' + e.message + '</p></div>';
  }
}

function renderDetail(container, data) {
  const campaigns = data.campaigns || [];
  let html = '<div class="account-meta" style="display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.8rem;color:var(--bone-dim);margin-bottom:.9rem;padding-bottom:.6rem;border-bottom:1px solid rgba(42,42,58,.4)">';
  html += '<span>Created: <b style="color:var(--bone);font-weight:400">' + fmtDate(data.created_at) + '</b></span>';
  html += '<span>Last login: <b style="color:var(--bone);font-weight:400">' + fmtDate(data.last_login) + '</b></span>';
  html += '<span>Turn cap: <b style="color:var(--gold-bright);font-weight:700">' + (data.turn_cap === 0 ? '∞ Lifetime' : data.turn_cap + ' / day') + '</b></span>';
  html += '<span>Turns used: <b style="color:var(--term-amber);font-weight:400">' + (data.turns_used || 0) + '</b></span>';
  const tier = (data.subscription_status || 'free') === 'premium' ? 'tier2' : (data.subscription_status || 'free');
  const isPremium = tier !== 'free';
  const tierNames = { tier1: '🔹 Support', tier2: '⚔ Patron', lifetime: '♾️ Lifetime' };
  html += '<span>💳 Membership: <b style="color:' + (isPremium ? 'var(--gold-bright);font-weight:700' : 'var(--bone);font-weight:400') + '">' + (isPremium ? (tierNames[tier] || '👑 ' + tier) + (data.subscription_until ? ' until ' + fmtDate(data.subscription_until) : '') : 'Free') + '</b></span>';
  html += '<span>Turn bonus: <b style="color:var(--term-amber);font-weight:400">' + (data.turn_bonus || 0) + '</b></span>';
  const promo = data.promo_bonus || 0;
  if (promo > 0) {
    html += '<span style="background:rgba(46,204,113,.14);border:1px solid rgba(46,204,113,.5);border-radius:5px;padding:.15rem .6rem;color:var(--term-green);font-weight:600">🎁 Signup promo: <b style="font-weight:800">' + promo + '</b> turns</span>';
  } else {
    html += '<span>Promo (signup): <b style="color:var(--term-green);font-weight:400">' + promo + '</b></span>';
  }
  html += '<span>💰 Revenue: <b style="color:var(--gold-bright);font-weight:400">' + fmtSek(data.revenue) + '</b></span>';
  const at = data.tts_usage || {};
  if (at.calls) {
    html += '<span>🔊 TTS: <b style="color:var(--arcane);font-weight:400">' + fmtTokens(at.tokens || 0) + ' tkn ≈ · ' + (at.calls || 0) + ' renders · ' + fmtTokens(at.chars || 0) + ' chars · ' + Math.round(at.seconds || 0) + 's (' + ((at.seconds || 0) / 60).toFixed(1) + ' min)</b></span>';
  }
  const cc = data.character_creation || {};
  if (cc.tokens) {
    html += '<span>🎭 Char-gen: <b style="color:var(--gold-bright);font-weight:400">' + fmtTokens(cc.tokens) + ' tkn</b> · ' + (cc.calls || 0) + ' gens</span>';
  }
  const ig = data.image_gen || {};
  if (ig.calls) {
    html += '<span>🖼️ Image gen: <b style="color:var(--gold-bright);font-weight:400">' + (ig.calls || 0) + '</b> iterations</span>';
  }
  const dc = data.deleted_campaigns || {};
  if (dc.total_tokens || dc.turns) {
    html += '<span>🗑️ Deleted campaigns: <b style="color:var(--term-amber);font-weight:400">' + fmtTokens(dc.total_tokens || 0) + ' tkn</b> · ' + (dc.turns || 0) + ' turns' + (dc.tts && dc.tts.tokens ? ' · 🔊 ' + fmtTokens(dc.tts.tokens) + ' tts' : '') + '</span>';
  }
  html += '<span>📍 Country: <b style="color:var(--bone);font-weight:400">' + (data.country_flag || '❓') + ' ' + (data.country || 'Unknown') + '</b>' + (data.ip ? ' <span style="opacity:.6">(' + data.ip + ')</span>' : '') + '</span>';
  html += '</div>';
  // TIERS: top-up / reset / tier-knappar
  html += '<div class="billing-controls">';
  html += '<span class="bc-label">Turn bonus: <b style="color:var(--term-amber)">' + (data.turn_bonus || 0) + '</b> · promo: <b style="color:var(--term-green)">' + (data.promo_bonus || 0) + '</b> · used: <b style="color:var(--term-amber)">' + (data.period_turns_used || 0) + '</b></span>';
  html += '<input type="number" min="1" step="1" value="10" id="topup-' + data.username + '" class="cap-input" style="width:64px">';
  html += '<button onclick="topUp(\'' + data.username + '\')" class="bc-btn">➕ Top up</button>';
  html += '<button onclick="resetTurns(\'' + data.username + '\')" class="bc-btn danger">🔄 Reset turns</button>';
  if (isPremium) {
    html += '<button onclick="setTier(\'' + data.username + '\', \'free\')" class="bc-btn">⭱ Revert to Free</button>';
  } else {
    html += '<select id="dt-tier-' + data.username + '" onchange="syncTierDuration(\'' + data.username + '\')" class="cap-input" style="width:auto;background:var(--ink);color:var(--bone);border:1px solid var(--edge)"><option value="tier2">Patron · 30€</option><option value="lifetime">Lifetime · 100€</option></select>';
    html += '<select id="dt-months-' + data.username + '" class="cap-input" style="width:auto;background:var(--ink);color:var(--bone);border:1px solid var(--edge)"><option value="7" selected>7 d</option><option value="30">1 mo</option><option value="90">3 mo</option><option value="180">6 mo</option><option value="365">12 mo</option><option value="0">∞ forever</option></select>';
    html += '<button onclick="setTier(\'' + data.username + '\', document.getElementById(\'dt-tier-' + data.username + '\').value, document.getElementById(\'dt-months-' + data.username + '\').value)" class="bc-btn gold">👑 Grant</button>';
  }
  html += '</div>';
  if (campaigns.length === 0) {
    container.innerHTML = html + '<p style="color:var(--bone-dim);font-size:0.85rem;padding:0.5rem 0">No campaigns found.</p>';
    return;
  }

  campaigns.forEach(c => {
    const promptT = c.prompt_tokens || 0;
    const compT = c.completion_tokens || 0;
    const total = c.total_tokens || 0;
    const maxBar = Math.max(promptT, compT, 1);
    const promptPct = (promptT / maxBar * 100).toFixed(1);
    const compPct = (compT / maxBar * 100).toFixed(1);

    html += '<div class="campaign-card">';
    html += '<div class="cc-head">';
    html += '<span class="cc-name">' + (c.name || 'Nameless') + '</span>';
    html += '<span class="cc-char">' + (c.character_name || '—') + '</span>';
    html += '</div>';
    html += '<div class="cc-meta">';
    html += '<span>Level: <span>' + (c.level || 1) + '</span></span>';
    html += '<span>Location: <span>' + (c.location || '—') + '</span></span>';
    html += '<span>Turns: <span>' + (c.turns || 0) + '</span></span>';
    html += '<span>Updated: <span>' + relTime(c.last_updated) + '</span></span>';
    html += '</div>';

    if (total > 0) {
      html += '<div class="token-bar">';
      html += '<div class="bar-prompt" style="width:' + promptPct + '%"></div>';
      html += '<div class="bar-completion" style="width:' + compPct + '%"></div>';
      html += '</div>';
      html += '<div class="token-legend">';
      html += '<span class="dot prompt"></span>Prompt: ' + fmtTokens(promptT);
      html += '<span class="dot completion"></span>Response: ' + fmtTokens(compT);
      html += '<span>Total: ' + fmtTokens(total) + '</span>';
      html += '</div>';
      // Per-roll uppdelning — DM vs Lorekeeper vs bakgrund (faktextraktion,
      // sammanfattningar, dag-entries). Lorekeeper-tokens inkluderas ALLTID.
      const dmT = c.dm_tokens || 0;
      const gdT = c.guardian_tokens || 0;
      const bgT = c.background_tokens || 0;
      html += '<div class="role-split">';
      html += '<span>🧙 DM: <b>' + fmtTokens(dmT) + '</b></span>';
      html += '<span>🦉 Lorekeeper: <b>' + fmtTokens(gdT) + '</b></span>';
      if (bgT > 0) html += '<span>🛠️ Bakgrund (fakta/dagbok/summaries): <b>' + fmtTokens(bgT) + '</b></span>';
      html += '</div>';
      // Per-modell-uppdelning — vilka LLM-modeller som faktiskt användes
      const models = c.model_breakdown || {};
      const modelKeys = Object.keys(models);
      if (modelKeys.length > 0) {
        html += '<div class="model-split">';
        modelKeys.forEach(m => {
          const mv = models[m];
          const mTotal = (mv.prompt_tokens || 0) + (mv.completion_tokens || 0);
          html += '<span>🤖 ' + m + ': <b>' + fmtTokens(mTotal) + '</b> (' + (mv.calls || 0) + ' calls)</span>';
        });
        html += '</div>';
      }
      // TTS per kampanj — tokens/sekunder/minuter renderat
      const ctts = c.tts_usage || {};
      if (ctts.calls) {
        html += '<div class="role-split"><span>🔊 TTS: <b>' + fmtTokens(ctts.tokens || 0) + ' tkn</b> · ' + (ctts.calls || 0) + ' readouts · ' + fmtTokens(ctts.chars || 0) + ' chars · ' + Math.round(ctts.seconds || 0) + 's (' + ((ctts.seconds || 0) / 60).toFixed(1) + ' min)</span></div>';
      }
    }

    // Sessions
    if (c.sessions && c.sessions.length > 0) {
      html += '<div class="session-list">';
      c.sessions.forEach(s => {
        html += '<div class="session-item">';
        html += '<span>' + s.session_file + ' · ' + s.turns + ' turns</span>';
        html += '<span class="s-tokens">' + fmtTokens(s.total_tokens) + ' tkn</span>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  // ── ⚡ Turn-ledger (2026-08-08, strikt per-anrops-modell) ──
  // Exakt förbrukning per anrop: per-åtgärd idag/totalt + senaste posterna.
  const tlToday = data.turn_ledger_today || {};
  const tlRecent = data.turn_ledger_recent || [];
  const TL_LABELS = { dm: '🧙 DM', guardian_pre: '🛡️ Guardian pre', guardian_post: '🛡️ Guardian post', extraction: '📚 Lorekeeper (fakta)', image: '🎨 Bild', char_gen: '👤 Karaktär', search: '🔍 [SÖK:]', repair: '🔧 Repair', summary: '📖 Sammanfattning', day_entry: '📆 Dag-entry', battle_ai: '⚔️ Battle AI', tts: '🔊 TTS' };
  if (Object.keys(tlToday).length > 0 || tlRecent.length > 0) {
    html += '<div class="turn-ledger-block" style="margin-top:.9rem;padding-top:.7rem;border-top:1px solid rgba(42,42,58,.4)">';
    html += '<div style="font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem">⚡ Turn-ledger — exakt förbrukning per anrop (idag)</div>';
    html += '<div class="role-split" style="flex-wrap:wrap">';
    Object.keys(tlToday).sort().forEach(a => {
      const t = tlToday[a] || {};
      html += '<span style="background:rgba(212,169,44,.08);border:1px solid rgba(212,169,44,.35);border-radius:5px;padding:.15rem .55rem;color:var(--bone-bright)">' + (TL_LABELS[a] || a) + ': <b style="color:var(--gold-bright)">' + (t.turns || 0) + '</b> turns' + ((t.tokens || 0) ? ' · ' + fmtTokens(t.tokens) + ' tkn' : '') + '</span>';
    });
    if (!Object.keys(tlToday).length) html += '<span style="color:var(--bone-dim)">Inga förbrukade turns idag ännu</span>';
    html += '</div>';
    if (tlRecent.length) {
      html += '<div style="font-size:.72rem;color:var(--bone-dim);margin:.5rem 0 .3rem">Senaste ' + tlRecent.length + ' anrop (nyaste sist):</div>';
      html += '<div style="max-height:220px;overflow-y:auto;border:1px solid var(--edge);border-radius:4px">';
      tlRecent.forEach(e => {
        const ts = (e.ts || '');
        const label = TL_LABELS[e.action] || e.action;
        html += '<div style="display:flex;gap:.6rem;align-items:center;padding:.22rem .5rem;border-bottom:1px solid rgba(42,42,58,.35);font-size:.74rem;color:var(--bone)"><span style="color:var(--bone-dim);flex:none">' + ts.slice(0, 10) + ' ' + ts.slice(11, 19) + '</span><span style="flex:none">' + label + '</span><span style="color:var(--bone-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (e.model || '—') + '</span><span style="flex:none;color:var(--bone-dim)">' + fmtTokens(e.tokens || 0) + ' tkn</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }
  container.innerHTML = html;
}

// ═══════════════════════════════════════
// EMBERS (from login.html)
// ═══════════════════════════════════════
const canvas = document.getElementById('embers');
const ctx = canvas.getContext('2d');
let W, H, embers = [];
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);
function spawn(init) {
  return { x: Math.random()*W, y: init ? Math.random()*H : H+10, r: 0.7+Math.random()*1.6,
    vy: 0.2+Math.random()*0.6, vx: (Math.random()-0.5)*0.3, life: 0,
    max: 400+Math.random()*500, hue: Math.random()<0.8 ? 22+Math.random()*18 : 268+Math.random()*20 };
}
for (let i=0;i<30;i++) embers.push(spawn(true));
const GLOW={};function glowSprite(hue){const key=Math.round(hue/10)*10;if(GLOW[key])return GLOW[key];const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');const rg=g.createRadialGradient(24,24,0,24,24,24);rg.addColorStop(0,'hsla('+key+',90%,65%,1)');rg.addColorStop(.4,'hsla('+key+',85%,55%,.55)');rg.addColorStop(1,'hsla('+key+',80%,50%,0)');g.fillStyle=rg;g.fillRect(0,0,48,48);GLOW[key]=c;return c;}
function tick() {
if (document.hidden) { requestAnimationFrame(tick); return; }
  ctx.clearRect(0,0,W,H);
  for (let i=0;i<embers.length;i++) {
    const e=embers[i]; e.life++; e.y-=e.vy; e.x+=e.vx+Math.sin(e.life*0.02)*0.12;
    const fade=Math.min(1,e.life/60)*Math.max(0,1-e.life/e.max);
    const fl=0.5+Math.sin(e.life*0.15+i)*0.35;
    ctx.globalAlpha=0.45*fade*fl;
    ctx.drawImage(glowSprite(e.hue),e.x-e.r*2,e.y-e.r*2,e.r*4,e.r*4);
    if (e.life>e.max||e.y<-12) embers[i]=spawn(false);
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(tick);
}
tick();

// ═══════════════════════════════════════
loadStats();
