<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Re-forge Your Word — The Lore Weaver's Cauldron</title>
<meta name="description" content="Set a new password for your adventurer — The Lore Weaver's Cauldron.">
<link rel="icon" href="/assets/logo-cauldron.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Spectral:ital,wght@0,300;0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Kanonisk palett = snes.css :root (Terminal Gothic, 2026-09-10) */
    --ink:#1a1426;
    --stone:#271d33; --stone-2:#322541; --stone-3:#3d2e4f;
    --edge:#463a60; --edge-hi:#5a4a7a;
    --bone:#d9c9a6; --bone-bright:#f2e6c8; --bone-dim:#9d8a6a;
    --gold:#d4a92c; --gold-bright:#f0d675;
    --blood:#a32433; --blood-bright:#e0485a;
    --ember:#d4691e; --arcane:#9a6fe0; --arcane-bright:#c9a6ff;
    --poison:#7aa35e; --teal:#5e9aa3;
    --term-green:#33cc33; --term-amber:#ccaa33;
    --font-display:'Cinzel',serif;
    --font-body:'Spectral',Georgia,serif;
    --font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --font-accent:'Silkscreen',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font-body);color:var(--bone);background:var(--ink);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:1.2rem;-webkit-tap-highlight-color:transparent}
  .card{position:relative;z-index:1;width:min(400px,100%);background:var(--stone);
    border:1px solid var(--edge);padding:2.2rem 2rem;text-align:center}
  .card::before{content:'';position:absolute;inset:3px;border:1px solid var(--edge);pointer-events:none;opacity:.3}
  .sig{font-size:1.6rem;margin-bottom:.5rem}
  h1{font-family:var(--font-display);font-weight:700;font-size:1.25rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold);margin-bottom:.4rem}
  .sub{font-size:.86rem;color:var(--bone-dim);margin-bottom:1.6rem;line-height:1.6}
  .field{margin-bottom:1rem;text-align:left}
  .field label{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--bone-dim);margin-bottom:.35rem}
  .field input{width:100%;font-family:var(--font-body);font-size:16px;color:var(--bone-bright);
    background:var(--ink);border:1px solid var(--edge);padding:.72rem .9rem;outline:none}
  .field input:focus{border-color:var(--gold)}
  .btn{width:100%;margin-top:.5rem;cursor:pointer;font-family:var(--font-display);
    font-weight:700;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;
    padding:.85rem 1rem}
  .btn:disabled{opacity:.55;cursor:default}
  .err{min-height:1.4rem;margin-top:.8rem;font-size:.82rem;color:var(--blood-bright);line-height:1.5}
  .err.ok{color:#8fd48a}
  .back{display:inline-block;margin-top:1.1rem;font-size:.78rem;letter-spacing:.06em;
    color:var(--bone-dim);text-decoration:none}
  .back:hover{color:var(--gold-bright)}
  .badge{display:inline-block;margin-bottom:1rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold-bright);border:1px solid var(--edge-hi);padding:.28rem .7rem}
  /* ── Mobilpass (2026-09-06, audit-design-system §8.7): reset.html var enda
     riktiga sidan utan breakpoints — speglar login.html:s småskärmsmönster. ── */
  @media (max-width:600px){
    body{padding:.8rem;align-items:flex-start;padding-top:2.2rem}
    .card{width:100%;padding:1.6rem 1.2rem}
    h1{font-size:1.05rem;letter-spacing:.12em}
    .sub{font-size:.82rem;margin-bottom:1.2rem}
    .field input{padding:.8rem .85rem}
    .btn{padding:.95rem 1rem;font-size:.75rem}
    .badge{font-size:.62rem;padding:.24rem .6rem}
  }
  @media (max-width:360px){
    .card{padding:1.3rem .95rem}
    h1{font-size:.95rem}
  }
</style>
<link rel="stylesheet" href="snes.css?v=42">
</head>
<body>
<div class="card">
  <div class="sig">🦉</div>
  <div class="badge">The Lore Weaver's Cauldron</div>
  <h1 id="title">Re-forge Your Word</h1>
  <p class="sub" id="sub">The pot remembers you. Speak a new secret word — it will be yours from now on.</p>

  <form id="reset-form">
    <div class="field">
      <label for="pass">New Password</label>
      <input type="password" id="pass" placeholder="A new secret word&hellip;" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Speak it once more&hellip;" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn go-btn" id="btn">Re-forge My Word</button>
    <div class="err" id="err"></div>
  </form>

  <a class="back" href="login.html">&#8592; Back to the Cauldron</a>
</div>

<script src="api.js?v=20260804c"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = (params.get('token') || '').trim();
  const errEl = document.getElementById('err');
  const btn = document.getElementById('btn');
  const form = document.getElementById('reset-form');

  function fail(msg) {
    errEl.classList.remove('ok');
    errEl.textContent = msg;
    btn.disabled = false;
  }
  function ok(msg) {
    errEl.classList.add('ok');
    errEl.textContent = msg;
  }

  if (!token) {
    form.style.display = 'none';
    document.getElementById('title').textContent = 'Broken Link';
    document.getElementById('sub').textContent = 'This reset link has no token. Ask for a new one from the login page.';
    return;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pass = document.getElementById('pass').value;
    const confirm = document.getElementById('confirm').value;
    errEl.textContent = '';
    if (pass !== confirm) { fail('The new words do not match.'); return; }
    if (pass.length < 6) { fail('The new word needs at least 6 characters.'); return; }
    btn.disabled = true;
    btn.textContent = 'Re-forging&hellip;';
    try {
      const res = await API.resetWithToken(token, pass);
      sessionStorage.setItem('dnd_user', res.username);
      ok('🕊️ Your word is re-forged. The Cauldron welcomes you back.');
      setTimeout(() => { window.location.href = 'adventure.html'; }, 1100);
    } catch (err) {
      fail(err && err.message && !/HTTP/.test(err.message) ? err.message : 'That link is invalid or expired. Ask for a new one.');
      btn.textContent = 'Re-forge My Word';
    }
  });
})();
</script>
<script src="i18n.js?v=20260906a"></script>
<script src="sprites.js?v=20260806b"></script>
</body>
</html>
